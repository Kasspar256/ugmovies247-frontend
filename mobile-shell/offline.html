<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UG Movies 247 Offline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0c10;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
      }

      main {
        width: min(420px, 100%);
        border: 1px solid rgba(255, 255, 255, 0.11);
        border-radius: 28px;
        background: linear-gradient(180deg, rgba(31, 40, 51, 0.88), rgba(12, 15, 20, 0.96));
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.56);
        padding: 28px 22px;
        text-align: center;
      }

      img {
        width: 78px;
        height: 78px;
        border-radius: 20px;
        object-fit: cover;
      }

      h1 {
        margin: 22px 0 0;
        font-size: 28px;
        line-height: 1.05;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      p {
        margin: 14px auto 0;
        max-width: 320px;
        color: rgba(255, 255, 255, 0.68);
        font-size: 15px;
        line-height: 1.65;
      }

      .actions {
        display: grid;
        gap: 12px;
        margin-top: 26px;
      }

      a,
      button {
        min-height: 52px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #1f2833;
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-decoration: none;
        text-transform: uppercase;
      }

      .primary {
        border-color: #d90429;
        background: #d90429;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="siteicon.png" alt="UG Movies 247" />
      <h1>You are offline</h1>
      <p>Your connection is paused. Reconnect to browse, or open downloads after the app is back online.</p>
      <div class="actions">
        <button class="primary" type="button" onclick="location.reload()">Try Again</button>
        <a href="https://ugmovies247.com/downloads">Go To Downloads</a>
      </div>
    </main>
  </body>
</html>
