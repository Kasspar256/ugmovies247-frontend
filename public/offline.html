<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B0C10" />
    <title>UGMOVIES247 offline</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0b0c10;
        color: #fff;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        background:
          radial-gradient(circle at 80% 20%, rgba(217, 4, 41, 0.18), transparent 34rem),
          linear-gradient(180deg, #10131b 0%, #07080c 100%);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 440px);
        text-align: center;
      }

      .mark {
        width: 92px;
        height: 92px;
        margin: 0 auto 28px;
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        display: grid;
        place-items: center;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      }

      .mark img {
        width: 70px;
        height: 70px;
        object-fit: contain;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        padding: 9px 14px;
        color: rgba(255, 255, 255, 0.7);
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h1 {
        margin: 22px 0 0;
        font-size: clamp(34px, 10vw, 48px);
        line-height: 0.98;
        letter-spacing: 0;
      }

      p {
        margin: 18px auto 0;
        max-width: 34rem;
        color: rgba(255, 255, 255, 0.68);
        font-size: 15px;
        line-height: 1.75;
      }

      .actions {
        margin-top: 30px;
        display: grid;
        gap: 12px;
      }

      button,
      a {
        min-height: 54px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 0 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-decoration: none;
        text-transform: uppercase;
      }

      button {
        background: #d90429;
      }

      a {
        background: rgba(255, 255, 255, 0.06);
      }

      .hint {
        min-height: 22px;
        margin-top: 14px;
        color: rgba(255, 255, 255, 0.48);
        font-size: 12px;
        line-height: 1.6;
      }
    </style>
    <script>
      function openDownloads() {
        var hint = document.getElementById('offline-downloads-hint');

        if (hint) {
          hint.textContent = 'Opening saved downloads on this device...';
        }

        window.location.assign('/downloads');

        window.setTimeout(function () {
          if (hint) {
            hint.textContent =
              'If downloads do not open, reconnect once so the saved downloads screen can refresh.';
          }
        }, 1600);
      }
    </script>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <img src="/siteicon.png" alt="" />
      </div>
      <div class="eyebrow">Offline Mode</div>
      <h1>Connection paused</h1>
      <p>
        UGMOVIES247 is ready to continue as soon as your internet comes back.
        Saved pages and downloads on this device will still open where supported.
      </p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Try Again</button>
        <button type="button" onclick="openDownloads()">Open Downloads</button>
      </div>
      <div id="offline-downloads-hint" class="hint" aria-live="polite"></div>
    </main>
  </body>
</html>
